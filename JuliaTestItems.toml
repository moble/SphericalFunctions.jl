# Where test items are looked for.  Scanning every `.jl` file is the
# right default for most packages, but not this one:
# `docs/src/conventions/comparisons` holds generated output, so it
# should not be searched.  Listing the three trees that do hold test
# items is clearer than excluding the ones that do not.
#
#   src/**                    a handful of items live next to the code
#                             they test
#   test/**                   the bulk of the suite
#   docs/literate_input/**    the literature-comparison pages, which
#                             are Literate scripts containing test
#                             items; parts of `docs/src/**` are
#                             generated from them at build time and
#                             would otherwise be scanned twice
include = ["src/**", "test/**", "docs/literate_input/**"]
