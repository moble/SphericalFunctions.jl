name: benchmarks

# The regression benchmarks in `benchmark/benchmarks.jl`, run on demand.  They use the
# benchmark project of the workspace, exactly as the command at the top of that file does,
# and the results appear in the summary of the run.  Timings on shared runners are noisy, so
# they are useful for spotting large changes, such as a slowdown by an order of magnitude, and
# not for small ones.

on:
  workflow_dispatch:

permissions:
  actions: write  # needed by julia-actions/cache to delete old caches it has created
  contents: read

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          show-versioninfo: true
      - uses: julia-actions/cache@v3
      - name: Install the benchmark environment
        run: julia --project=benchmark --color=yes -e 'using Pkg; Pkg.instantiate()'
      - name: Run the benchmarks
        run: |
          julia --project=benchmark --color=yes -e '
            using PkgBenchmark
            results = benchmarkpkg("SphericalFunctions")
            export_markdown("benchmark/results.md", results)'
      - name: Report the results
        run: cat benchmark/results.md >> "$GITHUB_STEP_SUMMARY"
