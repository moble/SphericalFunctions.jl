name: docs
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
  release:

jobs:

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write  # needed by julia-actions/cache to delete old caches it has created
      contents: write
      statuses: write
    if: >-
        !contains(github.event.head_commit.message, '[skip ci]')
        && !contains(github.event.head_commit.message, '[skip docs]')
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          show-versioninfo: true
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        # `makedocs` in docs/make.jl runs the doctests, so a failing doctest fails this step
        # before anything is deployed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
