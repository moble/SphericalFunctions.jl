# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
  - package-ecosystem: "julia"
    # The top-level Project.toml lists the test, docs and benchmark projects as members of its
    # workspace, so this one directory covers all four projects.
    directory: "/"
    schedule:
      interval: "weekly"
